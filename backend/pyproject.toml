[project]
name = "threat-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "greenlet>=3.1",
  "PyJWT>=2.9",
  "bcrypt>=4.2",
  "pyotp>=2.9",
  "python-multipart>=0.0.12",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "import-linter>=2.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# --- Architectural boundaries (make arch) ---
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layers stay pure"
type = "forbidden"
source_modules = ["app.modules.*.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.core.database"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["app.api", "app.modules", "app.core"]
