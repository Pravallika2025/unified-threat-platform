services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: threat
      POSTGRES_DB: threat_platform
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql+asyncpg://threat:threat@postgres:5432/threat_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-me
      AUTO_CREATE_TABLES: "true"
      DETECTION_CONTENT_PATH: /detection-content
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./detection-content:/detection-content:ro
    depends_on:
      postgres: { condition: service_healthy }
    command: >
      sh -c "python -m app.seeds.run && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]

volumes:
  pgdata:
