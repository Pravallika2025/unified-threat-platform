services:
  - type: web
    name: unified-threat-platform-backend
    env: python
    buildCommand: "cd backend && pip install --no-cache-dir -e '.[dev]'"
    startCommand: "cd backend && python -m app.seeds.run && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
