risk_multiplier: 1.3
auto_response_allowed: false
enabled_rule_categories: [all]
critical_assets:
  - ops
  - baggage
  - scada
  - flight-info
  - access-control
business_hours: [0, 24]
notes: >
  Operational technology segments must never be auto-blocked. Route OT alerts to a
  named engineer, not to an automated executor.
