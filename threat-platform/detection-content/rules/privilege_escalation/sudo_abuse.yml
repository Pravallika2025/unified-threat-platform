id: PRIV-0001
title: Repeated privilege escalation attempts
description: Multiple failed sudo or runas attempts by one account.
severity: high
enabled: true
environments: [all]
source_types: [linux_auth, windows_security, server]
attack:
  tactic: TA0004
  technique: T1548
logic:
  type: threshold
  where:
    - { field: message, op: contains, value: "sudo" }
    - { field: event_outcome, op: eq, value: failure }
  group_by: [user_name, host_name]
  count: 5
  window: 10m
risk:
  impact: 4
  likelihood: 3
response_suggestions: [escalate, monitor]
