id: AUTH-0001
title: Possible brute force login attack
description: >
  A high number of failed authentication attempts from one source or against one
  account inside a short window. Tune the count per environment — a university
  network legitimately produces more failures than a hospital clinical segment.
severity: high
enabled: true
environments: [all]
source_types: [all]
attack:
  tactic: TA0006
  technique: T1110
logic:
  type: threshold
  where:
    - { field: event_action, op: eq, value: login_failed }
  group_by: [source_ip, user_name]
  count: 8
  window: 5m
risk:
  impact: 3
  likelihood: 4
response_suggestions: [monitor, block_ip]
