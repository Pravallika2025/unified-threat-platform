id: EXFIL-0001
title: Unusually large outbound data transfer
description: >
  A single transfer above the threshold to an external destination. The byte
  threshold is deliberately conservative — lower it once you have baselined
  normal traffic for the environment.
severity: high
enabled: true
environments: [all]
source_types: [firewall, waf, siem]
attack:
  tactic: TA0010
  technique: T1048
logic:
  type: match
  where:
    - { field: bytes_out, op: gt, value: 500000000 }
risk:
  impact: 5
  likelihood: 3
response_suggestions: [escalate, block_ip, monitor]
