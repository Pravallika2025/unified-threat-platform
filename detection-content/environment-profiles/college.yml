# Open network by design: BYOD, research traffic, high failed-login baseline.
risk_multiplier: 0.9
auto_response_allowed: false
enabled_rule_categories: [all]
critical_assets:
  - sis
  - finance
  - research-data
  - exam-server
business_hours: [7, 22]
notes: >
  Raise brute-force thresholds here. Student devices produce a large volume of
  benign authentication failures at term start.
